<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>YouTube Habits</title>
  <style>
    /* ---------- Design tokens ---------- */
    :root {
      --bg: #f4f5f9;
      --card: #ffffff;
      --text: #1b2130;
      --muted: #6a7284;
      --faint: #a3a9b6;
      --line: #e7e9f0;
      --track: #eceef4;
      --study: #4f7cff;
      --fun: #ff7a59;
      --idle: #9aa4b2;
      --good: #16a34a;
      --bad: #e0483e;
      --radius: 14px;
      --shadow: 0 1px 2px rgba(20, 28, 45, .05), 0 4px 14px rgba(20, 28, 45, .05);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1218;
        --card: #181c25;
        --text: #e7eaf1;
        --muted: #9199aa;
        --faint: #5f6778;
        --line: #262c38;
        --track: #232835;
        --shadow: none;
      }
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; overflow-x: hidden; }
    main > *, .compare > *, .legend, .insight > *, .top-row > * { min-width: 0; }
    body {
      width: 400px;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    a:hover { text-decoration: underline; }
    button { font: inherit; color: inherit; cursor: pointer; }

    /* ---------- Header ---------- */
    header {
      position: sticky; top: 0; z-index: 5;
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px 10px;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 650; font-size: 14px; letter-spacing: -.01em; }
    .brand-mark { width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(135deg, var(--study) 0 50%, var(--fun) 50% 100%); position: relative; }
    .brand-mark::after { content: ""; position: absolute; left: 8px; top: 6px; border-left: 8px solid #fff; border-top: 5px solid transparent; border-bottom: 5px solid transparent; }
    .datenav { display: flex; align-items: center; gap: 4px; }
    .datenav button {
      width: 26px; height: 26px; border-radius: 8px; border: 1px solid var(--line);
      background: var(--card); line-height: 1; font-size: 14px;
    }
    .datenav button:disabled { opacity: .35; cursor: default; }
    #dateLabel { min-width: 128px; text-align: center; font-weight: 600; font-size: 12px; }

    main { padding: 10px 12px 14px; display: grid; gap: 10px; }

    .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px 14px; border: 1px solid var(--line); }
    .card h2 { margin: 0 0 8px; font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
    .card h2 small { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--faint); }

    /* ---------- Live status ---------- */
    .status { display: flex; gap: 10px; align-items: flex-start; }
    .status .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 4px; flex: none; background: var(--c, var(--faint)); }
    .status .dot.live { box-shadow: 0 0 0 0 var(--c); animation: pulse 1.8s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--c) 55%, transparent); } 70% { box-shadow: 0 0 0 8px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
    .status-text { min-width: 0; flex: 1; }
    .status-text b { font-size: 14px; }
    .status-text .since { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    .status-line { margin-top: 2px; font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .status-text small { display: block; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .muted { color: var(--muted); }

    /* ---------- Donut + legend ---------- */
    .overview { display: flex; gap: 14px; align-items: center; }
    .donut { width: 132px; height: 132px; flex: none; }
    .donut .center-big { font-size: 15px; font-weight: 700; fill: var(--text); font-variant-numeric: tabular-nums; }
    .donut .center-small { font-size: 10px; fill: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
    .legend { flex: 1; display: grid; gap: 8px; }
    .legend-row { display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: baseline; }
    .legend-row i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); transform: translateY(1px); }
    .legend-row .name { font-weight: 600; }
    .legend-row .pct { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
    .legend-row .time { grid-column: 2 / 4; font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.01em; margin-top: -2px; }

    /* ---------- Comparison ---------- */
    .compare { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .cmp { border-radius: 10px; background: color-mix(in srgb, var(--c) 9%, var(--card)); padding: 8px 9px; border: 1px solid color-mix(in srgb, var(--c) 18%, var(--line)); }
    .cmp .lbl { font-size: 11px; font-weight: 650; color: var(--c); }
    .cmp .val { font-weight: 700; font-variant-numeric: tabular-nums; }
    .cmp small { display: block; font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .up-good, .down-good { color: var(--good); }
    .up-bad, .down-bad { color: var(--bad); }

    /* ---------- Insights ---------- */
    .insights { display: grid; gap: 0; }
    .insight { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 7px 0; border-top: 1px solid var(--line); }
    .insight:first-child { border-top: 0; padding-top: 0; }
    .insight .k { color: var(--muted); display: flex; align-items: center; gap: 6px; }
    .insight .k i { width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--faint)); flex: none; }
    .insight .v { font-weight: 650; text-align: right; font-variant-numeric: tabular-nums; }
    .insight .d { grid-column: 1 / 3; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 13px; }

    /* ---------- Charts ---------- */
    svg text { font-family: inherit; }
    .axis { font-size: 9px; fill: var(--faint); font-variant-numeric: tabular-nums; }
    .chart-caption { font-size: 11px; color: var(--muted); margin: 10px 0 4px; }
    .keyrow { display: flex; gap: 12px; font-size: 11px; color: var(--muted); margin-top: 4px; }
    .keyrow span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; background: var(--c); margin-right: 5px; }

    /* ---------- Classify current video ---------- */
    .classify p { margin: 0 0 8px; }
    .classify .why { font-size: 11.5px; color: var(--muted); margin-top: -4px; }
    .btnrow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .btn { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 5px 9px; font-size: 12px; font-weight: 550; }
    .btn:hover { border-color: var(--faint); }
    .btn.on { background: color-mix(in srgb, var(--c) 16%, var(--card)); border-color: var(--c); }
    .btn[data-c="study"] { --c: var(--study); }
    .btn[data-c="fun"] { --c: var(--fun); }

    /* ---------- Session log ---------- */
    .filters { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
    .filters button { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 3px 10px; font-size: 11.5px; font-weight: 600; color: var(--muted); }
    .filters button.on { background: var(--text); color: var(--card); border-color: var(--text); }
    .seglist { display: grid; gap: 0; max-height: 300px; overflow-y: auto; margin: 0 -4px; padding: 0 4px; }
    .seg { display: grid; grid-template-columns: 74px 3px 1fr; gap: 9px; padding: 7px 0; border-top: 1px solid var(--line); }
    .seglist .seg:first-child { border-top: 0; }
    .seg.live { border-top: 0; padding-top: 0; }
    .seg-time { display: grid; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; line-height: 1.35; }
    .seg-time span:first-child { color: var(--text); font-weight: 600; }
    .seg-bar { border-radius: 2px; }
    .seg-main { min-width: 0; }
    .seg-head { display: flex; align-items: center; gap: 6px; }
    .chip { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--c); background: color-mix(in srgb, var(--c) 13%, transparent); padding: 1px 6px; border-radius: 5px; }
    .seg-dur { font-size: 11.5px; font-weight: 650; font-variant-numeric: tabular-nums; }
    .nowtag { font-size: 10px; font-weight: 700; color: var(--bad); }
    .seg-title { font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
    .seg-sub { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .empty { color: var(--muted); padding: 10px 0; text-align: center; font-size: 12px; }

    /* ---------- Top lists ---------- */
    .toplist { display: grid; gap: 8px; }
    .top-row { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; }
    .top-row .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 550; }
    .top-row .n { font-weight: 650; font-variant-numeric: tabular-nums; }
    .top-row .s { grid-column: 1 / 3; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stack { grid-column: 1 / 3; display: flex; height: 5px; border-radius: 3px; overflow: hidden; background: var(--track); }
    .stack b { display: block; height: 100%; }
    .sub-h { font-size: 11px; font-weight: 650; color: var(--muted); margin: 12px 0 6px; }

    footer { display: flex; justify-content: space-between; gap: 8px; padding: 0 12px 14px; }
    footer .btn { flex: 1; text-align: center; padding: 7px 9px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <header>
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span>YouTube Habits</div>
    <div class="datenav">
      <button id="prevDay" title="Previous day" aria-label="Previous day">‹</button>
      <span id="dateLabel">Today</span>
      <button id="nextDay" title="Next day" aria-label="Next day">›</button>
    </div>
  </header>

  <main>
    <section class="card" id="status"></section>

    <section class="card">
      <h2>Breakdown <small id="trackedNote"></small></h2>
      <div class="overview">
        <div id="donut"></div>
        <div class="legend" id="legend"></div>
      </div>
    </section>

    <section class="card">
      <h2>Compared with <small>yesterday · 7-day average</small></h2>
      <div class="compare" id="compare"></div>
    </section>

    <section class="card">
      <h2>Where your time went</h2>
      <div class="insights" id="insights"></div>
    </section>

    <section class="card">
      <h2>Timeline <small id="ribbonRange"></small></h2>
      <div id="ribbon"></div>
      <div class="chart-caption">Minutes per hour</div>
      <div id="hourly"></div>
      <div class="keyrow">
        <span style="--c: var(--study)">Study</span>
        <span style="--c: var(--fun)">Fun</span>
        <span style="--c: var(--idle)">Idle</span>
      </div>
    </section>

    <section class="card classify hidden" id="classifyCard"></section>

    <section class="card">
      <h2>Start / stop log <small id="logCount"></small></h2>
      <div class="filters" id="filters">
        <button data-action="filter" data-filter="all" class="on">All</button>
        <button data-action="filter" data-filter="study">Study</button>
        <button data-action="filter" data-filter="fun">Fun</button>
        <button data-action="filter" data-filter="idle">Idle</button>
      </div>
      <div id="liveRow"></div>
      <div class="seglist" id="log"></div>
    </section>

    <section class="card">
      <h2>Top videos &amp; channels</h2>
      <div class="toplist" id="topVideos"></div>
      <div class="sub-h">Channels</div>
      <div class="toplist" id="topChannels"></div>
    </section>
  </main>

  <footer>
    <button class="btn" data-action="export-csv">Export day as CSV</button>
    <button class="btn" data-action="options">Settings</button>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
